name: Build Android via CI script

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK and NDK
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | sdkmanager --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          yes | sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache

      - name: Run Android build script
        env:
          CCACHE: 'true'
        run: |
          chmod +x ./.ci/android/build.sh
          ./.ci/android/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            artifacts/*
            src/android/app/build/outputs/**/*.apk
            src/android/app/build/outputs/**/*.aab
