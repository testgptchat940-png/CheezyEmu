name: Build Android via CI script

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (standard, legacy, optimized, chromeos)'
        default: 'standard'
      build_type:
        description: 'Build type (Release, RelWithDebInfo, Debug)'
        default: 'Release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '27.1.12297006'
          build-tools-version: '35.0.0'
          packages: |
            platform-tools
            platforms;android-35

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache

      - name: Run .ci/android/build.sh
        env:
          CCACHE: 'true'
        run: |
          chmod +x ./.ci/android/build.sh
          ./.ci/android/build.sh -t "${{ inputs.target }}" -b "${{ inputs.build_type }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.target }}-${{ inputs.build_type }}
          path: |
            artifacts/*
            src/android/app/build/outputs/**/*.apk
            src/android/app/build/outputs/**/*.aab
